# Balanced Ruff config: correctness and maintainability, not formatting churn.
line-length = 100

[lint]
select = [
  "E4",   # import errors
  "E7",   # statement errors
  "E9",   # syntax/runtime errors
  "F",    # Pyflakes
  "B",    # bugbear
  "C90",  # McCabe complexity
]
ignore = ["E501"]

[lint.mccabe]
max-complexity = 15
