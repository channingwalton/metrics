---
id: rust-domain-use-infra
language: Rust
severity: error
message: "Domain layer must not use infrastructure (Rust)."
files:
  - "**/domain/**"
rule:
  pattern: use $PKG;
constraints:
  PKG:
    regex: "infra|infrastructure"

---
id: python-domain-import-infra
language: Python
severity: error
message: "Domain layer must not import infrastructure (Python)."
files:
  - "**/domain/**"
rule:
  any:
    - pattern: import $MOD
    - pattern: from $MOD import $$$
constraints:
  MOD:
    regex: "infra|infrastructure"
